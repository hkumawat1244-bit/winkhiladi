<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Do You Love Me? 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:    #f472b6;
      --rose:    #e11d48;
      --cream:   #fff1f5;
      --dark:    #1a0a0e;
      --shadow:  rgba(244,114,182,0.35);
    }

    body {
      min-height: 100vh;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* ── floating petals background ── */
    .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .petal {
      position: absolute;
      top: -40px;
      font-size: 1.4rem;
      animation: fall linear infinite;
      opacity: 0.55;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* ── containers ── */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2.5rem 3rem;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(14px);
      border-radius: 2rem;
      border: 1.5px solid rgba(244,114,182,0.3);
      box-shadow: 0 20px 60px var(--shadow), 0 2px 8px rgba(0,0,0,0.05);
      max-width: 420px;
      width: 90vw;
    }

    /* ── question screen ── */
    #question-container { animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes popIn {
      from { opacity:0; transform: scale(.7) translateY(30px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }

    .local-gif {
      width: 200px;
      height: 150px;
      object-fit: cover;
      border-radius: 1.2rem;
      margin-bottom: 1.4rem;
      border: 3px solid var(--pink);
      box-shadow: 0 8px 24px var(--shadow);
    }

    h2.question {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--dark);
      margin-bottom: 1.8rem;
      line-height: 1.2;
    }

    .button-container { display: flex; gap: 1.2rem; justify-content: center; flex-wrap: wrap; }

    .btn {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-style: italic;
      padding: .75rem 2.2rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
      letter-spacing: .02em;
    }
    .btn:hover { transform: scale(1.08); }

    .yes-btn {
      background: linear-gradient(135deg, #f472b6, #e11d48);
      color: #fff;
      box-shadow: 0 6px 20px var(--shadow);
    }
    .yes-btn:hover { box-shadow: 0 10px 28px rgba(225,29,72,.45); }

    .no-btn {
      background: #fff;
      color: var(--rose);
      border: 2px solid var(--pink);
      box-shadow: 0 4px 12px rgba(244,114,182,.18);
      position: fixed; /* will be repositioned by JS */
    }

    /* ── result screen ── */
    #result-container {
      display: none;
      animation: heartBurst .7s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes heartBurst {
      0%   { opacity:0; transform: scale(.4) rotate(-8deg); }
      60%  { transform: scale(1.1) rotate(3deg); }
      100% { opacity:1; transform: scale(1) rotate(0); }
    }

    .gif-result {
      width: 220px;
      height: 165px;
      object-fit: cover;
      border-radius: 1.2rem;
      margin-bottom: 1.4rem;
      border: 3px solid var(--rose);
      box-shadow: 0 8px 32px rgba(225,29,72,.35);
    }

    #result-container h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      color: var(--rose);
      font-style: italic;
    }

    /* ── beating heart loader ── */
    .cssload-main {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }
    .cssload-heart {
      position: relative;
      width: 40px;
      height: 36px;
      animation: heartbeat .9s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1);   }
      14%      { transform: scale(1.25);}
      28%      { transform: scale(1);   }
      42%      { transform: scale(1.2); }
      56%      { transform: scale(1);   }
    }
    .cssload-heartL, .cssload-heartR {
      position: absolute;
      top: 0;
      width: 20px;
      height: 32px;
      background: var(--rose);
      border-radius: 20px 20px 0 0;
    }
    .cssload-heartL { left: 0;  transform-origin: 100% 100%; transform: rotate(-45deg); }
    .cssload-heartR { right: 0; transform-origin: 0%   100%; transform: rotate(45deg);  }
    .cssload-square {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 20px;
      height: 20px;
      background: var(--rose);
    }
    .cssload-shadow {
      margin: 6px auto 0;
      width: 28px;
      height: 7px;
      background: radial-gradient(ellipse, rgba(225,29,72,.4) 0%, transparent 70%);
      animation: heartbeat .9s ease-in-out infinite;
    }
  </style>
</head>
