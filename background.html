<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Spider Cursor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
    body { background: #000; min-height: 100vh; overflow: hidden; }

    .stars {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .star-dot {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle var(--d) ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.05; } to { opacity: 0.8; }
    }

    #spiderCanvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 999;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <canvas id="spiderCanvas"></canvas>

  <script>
    // ── Stars ──
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 200; i++) {
      const s = document.createElement('div');
      s.className = 'star-dot';
      const size = Math.random() * 2.5 + 0.3;
      s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*4+1).toFixed(1)}s;animation-delay:${(Math.random()*4).toFixed(1)}s;`;
      starsEl.appendChild(s);
    }

    // ── Canvas ──
    const canvas = document.getElementById('spiderCanvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

    // ── Web threads ──
    const webPoints = [];
    const MAX_WEB = 60;

    // ── Spider class ──
    class Spider {
      constructor(lagFactor, sizeMult, color) {
        this.x = window.innerWidth / 2;
        this.y = window.innerHeight / 2;
        this.vx = 0; this.vy = 0;
        this.lag = lagFactor;
        this.size = 20 * sizeMult;
        this.color = color;
        this.bodyAngle = 0;
        this.trail = [];
        this.TRAIL = 40;
        this.legPhase = 0;
        // 8 legs, each with 3 segments
        this.legs = Array.from({length: 8}, (_, i) => ({
          baseAngle: (i / 8) * Math.PI * 2,
          phase: Math.random() * Math.PI * 2
        }));
      }

      update(tx, ty) {
        const dx = tx - this.x, dy = ty - this.y;
        this.vx += dx * this.lag;
        this.vy += dy * this.lag;
        this.vx *= 0.72; this.vy *= 0.72;
        this.x += this.vx; this.y += this.vy;

        // Rotate body toward movement
        if (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1) {
          this.bodyAngle = Math.atan2(this.vy, this.vx);
        }

        this.legPhase += 0.18;
        this.trail.unshift({x: this.x, y: this.y});
        if (this.trail.length > this.TRAIL) this.trail.pop();
      }

      draw() {
        const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        const alpha = 1;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.bodyAngle + Math.PI/2);

        // ── Draw silk trail ──
        this.trail.forEach((pt, i) => {
          const a = (1 - i / this.TRAIL) * 0.25;
          const r = (1 - i / this.TRAIL) * 3;
          ctx.save();
          ctx.resetTransform();
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, r, 0, Math.PI*2);
          ctx.fillStyle = `rgba(255,255,255,${a})`;
          ctx.fill();
          ctx.restore();
        });

        // ── Draw silk thread from center ──
        if (this.trail.length > 2) {
          ctx.save();
          ctx.resetTransform();
          ctx.beginPath();
          ctx.moveTo(this.trail[0].x, this.trail[0].y);
          for (let i = 1; i < Math.min(this.trail.length, 20); i++) {
            ctx.lineTo(this.trail[i].x, this.trail[i].y);
          }
          ctx.strokeStyle = `rgba(200,200,255,0.12)`;
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }

        // ── 8 Legs with 3 segments each ──
        const legCount = 8;
        for (let i = 0; i < legCount; i++) {
          const side = i < 4 ? -1 : 1;
          const legIdx = i < 4 ? i : i - 4;
          const baseAng = (legIdx / 4) * Math.PI * 0.9 - Math.PI * 0.2;
          const wiggle = Math.sin(this.legPhase + legIdx * 1.2) * 0.25 * (speed * 0.05 + 1);

          const ang1 = side * (baseAng + wiggle);
          const seg1 = this.size * 0.9;
          const x1 = Math.cos(ang1) * seg1;
          const y1 = Math.sin(ang1) * seg1;

          const ang2 = ang1 + side * (0.9 + Math.sin(this.legPhase * 0.7 + legIdx) * 0.3);
          const seg2 = this.size * 0.85;
          const x2 = x1 + Math.cos(ang2) * seg2;
          const y2 = y1 + Math.sin(ang2) * seg2;

          const ang3 = ang2 + side * (0.7 + Math.sin(this.legPhase * 0.5 + legIdx) * 0.2);
          const seg3 = this.size * 0.6;
          const x3 = x2 + Math.cos(ang3) * seg3;
          const y3 = y2 + Math.sin(ang3) * seg3;

          // Leg shadow/glow
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 6;
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 1.8;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.lineTo(x3, y3);
          ctx.stroke();

          // Claw tips
          ctx.lineWidth = 1;
          ctx.shadowBlur = 3;
          const clawAng1 = ang3 + side * 0.5;
          const clawAng2 = ang3 + side * 0.2;
          ctx.beginPath();
          ctx.moveTo(x3, y3);
          ctx.lineTo(x3 + Math.cos(clawAng1)*this.size*0.25, y3 + Math.sin(clawAng1)*this.size*0.25);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x3, y3);
          ctx.lineTo(x3 + Math.cos(clawAng2)*this.size*0.2, y3 + Math.sin(clawAng2)*this.size*0.2);
          ctx.stroke();
        }

        ctx.shadowBlur = 0;

        // ── Abdomen (big rear body) ──
        const abdR = this.size * 0.52;
        const abdY = this.size * 0.55;
        const grad = ctx.createRadialGradient(0, abdY, 1, 0, abdY, abdR);
        grad.addColorStop(0, this.color === '#ffffff' ? 'rgba(80,80,90,0.95)' : 'rgba(40,0,60,0.95)');
        grad.addColorStop(1, 'rgba(10,10,15,0.98)');
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.ellipse(0, abdY, abdR * 0.75, abdR, 0, 0, Math.PI*2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Abdomen pattern
        ctx.strokeStyle = `rgba(255,255,255,0.12)`;
        ctx.lineWidth = 0.8;
        for (let p = 0; p < 3; p++) {
          ctx.beginPath();
          ctx.ellipse(0, abdY, (abdR*0.75)*(0.4+p*0.25), abdR*(0.35+p*0.22), 0, 0, Math.PI*2);
          ctx.stroke();
        }

        // ── Cephalothorax (front body) ──
        const headR = this.size * 0.32;
        const headGrad = ctx.createRadialGradient(-headR*0.2, -headR*0.2, 1, 0, 0, headR);
        headGrad.addColorStop(0, this.color === '#ffffff' ? 'rgba(120,120,130,0.9)' : 'rgba(80,20,100,0.9)');
        headGrad.addColorStop(1, 'rgba(20,15,25,0.95)');
        ctx.beginPath();
        ctx.ellipse(0, 0, headR*0.85, headR, 0, 0, Math.PI*2);
        ctx.fillStyle = headGrad;
        ctx.fill();

        // ── Eyes ──
        const eyePositions = [
          [-headR*0.35, -headR*0.35], [headR*0.35, -headR*0.35],
          [-headR*0.18, -headR*0.55], [headR*0.18, -headR*0.55],
          [-headR*0.5,  -headR*0.15], [headR*0.5,  -headR*0.15],
          [-headR*0.28, -headR*0.72], [headR*0.28, -headR*0.72],
        ];
        eyePositions.forEach(([ex, ey], ei) => {
          const eyeSize = ei < 2 ? 2.8 : 1.6;
          ctx.beginPath();
          ctx.arc(ex, ey, eyeSize, 0, Math.PI*2);
          ctx.fillStyle = this.color === '#ffffff' ? 'rgba(180,230,255,0.95)' : 'rgba(200,100,255,0.95)';
          ctx.fill();
          // Shine
          ctx.beginPath();
          ctx.arc(ex - eyeSize*0.3, ey - eyeSize*0.3, eyeSize*0.35, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.fill();
        });

        // ── Fangs ──
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.5;
        [[-headR*0.3, -headR], [headR*0.3, -headR]].forEach(([fx, fy]) => {
          ctx.beginPath();
          ctx.moveTo(fx, fy);
          ctx.quadraticCurveTo(fx * 1.4, fy - headR*0.5, fx * 1.2, fy - headR * 0.9);
          ctx.stroke();
        });

        ctx.restore();
      }
    }

    // ── Two spiders ──
    const spider1 = new Spider(0.09, 1.0, '#ffffff');
    const spider2 = new Spider(0.055, 0.72, 'rgba(180,100,255,0.9)');

    // ── Web drawing on click ──
    let webNodes = [];
    document.addEventListener('click', e => {
      webNodes.push({x: e.clientX, y: e.clientY, t: Date.now()});
      if (webNodes.length > 12) webNodes.shift();
    });

    function drawWeb() {
      if (webNodes.length < 2) return;
      const now = Date.now();
      webNodes = webNodes.filter(n => now - n.t < 4000);

      for (let i = 0; i < webNodes.length; i++) {
        for (let j = i+1; j < webNodes.length; j++) {
          const age1 = (now - webNodes[i].t) / 4000;
          const age2 = (now - webNodes[j].t) / 4000;
          const a = (1 - Math.max(age1, age2)) * 0.4;
          ctx.beginPath();
          ctx.moveTo(webNodes[i].x, webNodes[i].y);
          // Curved silk line
          const mx = (webNodes[i].x + webNodes[j].x)/2;
          const my = (webNodes[i].y + webNodes[j].y)/2 + 30;
          ctx.quadraticCurveTo(mx, my, webNodes[j].x, webNodes[j].y);
          ctx.strokeStyle = `rgba(200,200,255,${a})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }

      // Connect spider to nearest web node
      if (webNodes.length > 0) {
        const near = webNodes[webNodes.length-1];
        const age = (now - near.t) / 4000;
        const a = (1 - age) * 0.25;
        ctx.beginPath();
        ctx.moveTo(spider1.x, spider1.y);
        ctx.lineTo(near.x, near.y);
        ctx.strokeStyle = `rgba(255,255,255,${a})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }

    // ── Main loop ──
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      spider2.update(mouseX - 55, mouseY - 35);
      spider1.update(mouseX, mouseY);

      drawWeb();

      spider2.draw();
      spider1.draw();

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
